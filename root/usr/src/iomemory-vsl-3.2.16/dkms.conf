PACKAGE_NAME=iomemory-vsl
PACKAGE_VERSION=3.2.16.2
BUILT_MODULE_NAME[0]=iomemory-vsl
BUILT_MODULE_LOCATION[0]=''
DEST_MODULE_LOCATION[0]=/kernel/drivers/block
# Use the same target as `make module`, including downstream build prerequisites.
# Quote 'make' to stop DKMS injecting KERNELRELEASE (which selects Kbuild mode).
# Serialize the outer prerequisite graph; the kernel submake remains parallel.
MAKE[0]="'make' -j1 gpl DKMS_KERNEL_VERSION=${kernelver} KERNEL_BUILD=${kernel_source_dir} MODULE_VERSION=${PACKAGE_VERSION}"
CLEAN="'make' clean DKMS_KERNEL_VERSION=${kernelver} KERNEL_BUILD=${kernel_source_dir}"
AUTOINSTALL="yes"
