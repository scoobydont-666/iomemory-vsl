name: Driver contracts and DKMS builds
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dkms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dkms:
    # Public PR code must not run on a persistent/self-hosted storage machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify pinned source evidence without activating historical code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          # Validate full object IDs before using them as fetch arguments.
          # Fetch objects only: never check out or execute an evidence branch.
          python3 tools/verify_source_evidence.py --list-commits > "$RUNNER_TEMP/evidence-commits.txt"
          while IFS= read -r revision; do
            git fetch --no-tags --depth=1 origin "$revision"
          done < "$RUNNER_TEMP/evidence-commits.txt"
          python3 tools/verify_source_evidence.py | tee build-evidence/source-reconciliation.json
      - name: Offline lifecycle and failure-path tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/source-revision.txt
          python3 tools/verify_binary_artifacts.py | tee build-evidence/binary-verification.txt
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee build-evidence/offline-tests.log
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(git ls-files -z '*.sh' '*objtool_wrapper' '*dkms.conf')
      - name: Install DKMS and two header families (no kernel images)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential dkms linux-headers-generic linux-headers-generic-hwe-24.04
      - name: Real registration, repeat install and second-kernel autoinstall
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t kernels < <(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' -printf '%f\n' | sed 's/^linux-headers-//' | sort -V)
          test "${#kernels[@]}" -ge 2
          first=${kernels[0]}
          second=${kernels[${#kernels[@]}-1]}
          test "$first" != "$second"
          printf '%s\n' "${kernels[@]}" > "$GITHUB_WORKSPACE/build-evidence/header-releases.txt"
          sudo make dkms KERNELVER="$first"
          sudo make dkms KERNELVER="$first"
          first_version=$(modinfo -k "$first" -F version iomemory-vsl)
          cd "$RUNNER_TEMP"
          sudo dkms autoinstall -k "$second"
          dkms status -m iomemory-vsl -k "$second" | grep -E ': installed$'
          test "$(modinfo -k "$second" -F vermagic iomemory-vsl | awk '{print $1}')" = "$second"
          test "$(modinfo -k "$second" -F version iomemory-vsl)" = "$first_version"
          grep -Fx /usr/lib/fio /etc/ld.so.conf.d/fio.conf
          ldconfig -p | grep -F libvsl.so
          for kernel in "$first" "$second"; do
            modinfo -k "$kernel" iomemory-vsl > "$GITHUB_WORKSPACE/build-evidence/module-$kernel.txt"
          done
          # Do not load/unload modules, attach/format devices, or reboot.
      - name: Build the manual artifact route from Git-free staged source
        shell: bash
        run: |
          set -euo pipefail
          second=$(tail -n 1 "$GITHUB_WORKSPACE/build-evidence/header-releases.txt")
          version=$(modinfo -k "$second" -F version iomemory-vsl)
          manual="$RUNNER_TEMP/iomemory-manual"
          mkdir -p "$manual"
          sudo cp -a "/usr/src/iomemory-vsl-$version/." "$manual/"
          sudo chown -R "$(id -u):$(id -g)" "$manual"
          test ! -d "$manual/.git"
          # Run the public modules target without DKMS-only flags or install/load.
          make -C "$manual" modules KERNELVER="$second" \
            KERNEL_BUILD="/lib/modules/$second/build" MODULE_VERSION="$version" NCPUS=2 \
            2>&1 | tee "$GITHUB_WORKSPACE/build-evidence/manual-build.log"
          test "$(modinfo -F version "$manual/iomemory-vsl.ko")" = "$version"
          test "$(modinfo -F vermagic "$manual/iomemory-vsl.ko" | awk '{print $1}')" = "$second"
      - name: Collect build evidence, including failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          if test -d /var/lib/dkms/iomemory-vsl; then
            sudo find /var/lib/dkms/iomemory-vsl -type f \( -name make.log -o -name kfio_config.h -o -name .objtool-link-args -o -name Module.symvers \) \
              -exec cp --parents -t "$GITHUB_WORKSPACE/build-evidence" {} +
            sudo chown -R "$(id -u):$(id -g)" build-evidence
          fi
          # DKMS can clean its build directory after installation. The separate
          # manual build retains compiler/probe/objtool inputs before cleanup.
          manual="$RUNNER_TEMP/iomemory-manual"
          if test -d "$manual"; then
            evidence="$GITHUB_WORKSPACE/build-evidence/manual"
            mkdir -p "$evidence"
            for file in include/fio/port/linux/kfio_config.h .objtool-link-args .dkms-source-revision Module.symvers; do
              if test -f "$manual/$file"; then cp "$manual/$file" "$evidence/$(basename "$file")"; fi
            done
            if test -d "$manual/.objtool-first-party"; then
              cp -a "$manual/.objtool-first-party" "$evidence/"
            fi
            if test -f "$manual/iomemory-vsl.ko"; then
              modinfo "$manual/iomemory-vsl.ko" > "$evidence/module.txt"
              sha256sum "$manual/iomemory-vsl.ko" > "$evidence/module.sha256"
            fi
            find "$manual/kfio" -maxdepth 1 -type f -name '*.o' -exec sha256sum {} + > "$evidence/selected-core.sha256"
          fi
      - name: Retain exact-candidate build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-build-evidence-${{ github.sha }}
          path: build-evidence/
          include-hidden-files: true
          retention-days: 30
